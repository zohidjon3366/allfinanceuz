name: Consultation security checks

on:
  pull_request:
    paths:
      - 'server.js'
      - 'consult-security.js'
      - 'consult-security.test.js'
      - 'scripts/verify-build.js'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server and guard syntax
        run: |
          node --check server.js
          node --check consult-security.js
      - name: Run consultation security tests
        run: node consult-security.test.js
